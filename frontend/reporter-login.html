<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporter Access | JAN SETU</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="brand">
        <img src="assets/jansetu-logo.jpg" alt="JAN SETU Logo">
    </a>

    <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="list-all-problems.html">List of Problems</a>
        <a href="index.html#about">About</a>
        <a href="index.html#initiatives">Initiatives</a>
        <a href="index.html#explore">Explore Jharkhand</a>
        <a href="index.html#stories">Stories</a>
        <a href="index.html#resources">Resources</a>
        <a href="index.html#contact">Contact</a>
    </nav>
</header>

<main class="otp-page">
    <div class="otp-card">

        <p class="otp-label">REPORT A PROBLEM</p>

        <h1>
            Share a community <span>problem</span>
        </h1>

        <p class="otp-text">
            Continue to submit the problem location, description
            and optional supporting photos.
        </p>

        <button
            id="continueBtn"
            class="sms-btn"
            type="button"
        >
            Continue to Report
        </button>

        <p class="safe-text">
            After submission, keep your private Track ID to follow
            the problem's progress.
        </p>

    </div>
</main>

<div class="otp-landscape"></div>

<script>
document
    .getElementById("continueBtn")
    .addEventListener("click", function () {
        window.location.href = "report.html";
    });
</script>

</body>
</html>
